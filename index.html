<style id="page-style">
/* 기간과 기준일 → 핵심 이슈 → 회사 선택 → 회사별 기사 목록 */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #161a22;
  --muted: #5b6474;
  --line: #dde1e8;
  --accent: #1f4fd1;
  --accent-soft: #e6ecfb;
  --on-accent: #ffffff;
  --high: #c4372c;
  --mid: #b7791f;
  --low: #8a93a3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
[hidden] { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --fg: #e7eaf0; --muted: #98a1b2; --line: #2a303b;
    --accent: #7c9cf5; --accent-soft: #1d2640; --on-accent: #0f1218; --high: #ef7a70; --mid: #e0a94d; --low: #6f7889;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --fg: #e7eaf0; --muted: #98a1b2; --line: #2a303b;
  --accent: #7c9cf5; --accent-soft: #1d2640; --on-accent: #0f1218; --high: #ef7a70; --mid: #e0a94d; --low: #6f7889;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  display: grid; gap: 28px;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

header { display: grid; gap: 8px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 600; }

.refresh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 6px; }
.btn {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent);
}
.btn:disabled { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--accent); }
.status { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.status.warn { color: var(--high); }
.coverage-details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 16px; }
.coverage-details summary { color: var(--accent); cursor: pointer; font-weight: 600; }
.coverage-details h3 { font-size: 14px; margin: 16px 0 4px; }
.coverage-details p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; margin-top: 12px; }
.info-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
.info-table th, .info-table td { padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.info-table tr:last-child th, .info-table tr:last-child td { border-bottom: 0; }
.info-table thead th { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.info-table tbody th { font-weight: 600; }
.info-table td { color: var(--muted); }
.coverage-table { table-layout: fixed; }
.coverage-table tbody th { width: 26%; }
.coverage-table ul { margin: 6px 0 0; padding-left: 19px; }
.coverage-table li + li { margin-top: 5px; }
.scores-table { min-width: 620px; }
.scores-table tbody th { white-space: nowrap; }
.score-achieved { color: var(--accent); font-weight: 600; }
.score-missing { color: var(--muted); font-weight: 600; }
.coverage-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.coverage-tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-size: 13px; }
.coverage-records { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.coverage-records summary { font-size: 13px; }
.coverage-records p { font-size: 13px; color: var(--muted); }

.highlights { display: grid; gap: 10px; }
.highlights ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.highlights li { padding-left: 4px; }
.highlights .co { font-weight: 600; margin-right: 6px; }
.highlights .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }

.picker { display: grid; gap: 14px; }
.group { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] .n { color: var(--on-accent); opacity: .85; }
.chip.empty:not([aria-pressed="true"]) { color: var(--muted); }

.panel { display: grid; gap: 16px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.panel-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
.digest { margin: 0; color: var(--muted); max-width: 70ch; }
.outlet-score { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter {
  font: inherit; font-size: 13px; cursor: pointer; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.item {
  display: grid; grid-template-columns: 96px 112px minmax(0, 1fr); gap: 4px 16px;
  padding: 14px 16px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.outlet { font-size: 13px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.body { min-width: 0; display: grid; gap: 4px; }
.title { font-weight: 600; text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
.title:hover { color: var(--accent); text-decoration: underline; }
.summary { margin: 0; color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.imp { display: inline-flex; align-items: center; gap: 5px; }
.imp::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.imp.high::before { background: var(--high); }
.imp.mid::before { background: var(--mid); }
.cat { padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.auto { padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); }
.also a { color: var(--muted); }
.none { padding: 28px 16px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; }

@media (max-width: 640px) {
  .item { grid-template-columns: auto minmax(0, 1fr); }
  .item .body { grid-column: 1 / -1; }
  h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      scoreRow.appendChild(el("td", null, major === null ? "기준 확인 필요" : (major.join(", ") || "없음")));
      scoreRow.appendChild(el("td", null, outletResult.other.join(", ") || "—")); scoresBody.appendChild(scoreRow);
      var b = el("button", "chip" + (n ? "" : " empty"));
      b.type = "button"; b.id = "chip-" + c.id;
      b.appendChild(el("span", null, c.name));
      b.appendChild(el("span", "n", n + "/" + limit));
      b.addEventListener("click", function () { select(c.id, true); });
      document.getElementById(c.group === "pay" ? "chips-pay" : "chips-card").appendChild(b);
      chips[c.id] = b;
    });
    scoresTable.appendChild(scoresBody); scoresWrap.appendChild(scoresTable); scores.appendChild(scoresWrap);
  }

  function toggleRow(boxId, values, current, onPick) {
    var box = document.getElementById(boxId); box.textContent = "";
    values.forEach(function (v) {
      var b = el("button", "filter", v); b.type = "button";
      b.setAttribute("aria-pressed", String(v === current));
      b.addEventListener("click", function () { onPick(v); });
      box.appendChild(b);
    });
  }

  function render() {
    var c = companies.filter(function (x) { return x.id === state.id; })[0];
    if (!c) return;
    Object.keys(chips).forEach(function (k) { chips[k].setAttribute("aria-pressed", String(k === c.id)); });
    var arts = pick(c.articles || []);
    document.getElementById("co-name").textContent = c.name;
    document.getElementById("co-count").textContent = arts.length + " / " + limit + "건";
    document.getElementById("co-outlet-score").textContent = "매체 커버리지 " + scoreText(outletScore(arts));
    var dg = document.getElementById("co-digest");
    dg.textContent = [c.digest, c.searchStatus || (!arts.length ? "확인된 기사 없음. 검색 범위와 접근 여부를 확인하세요." : "")].filter(Boolean).join(" · "); dg.hidden = !dg.textContent;

    var cats = ["전체"];
    arts.forEach(function (a) { if (a.category && cats.indexOf(a.category) < 0) cats.push(a.category); });
    if (cats.indexOf(state.cat) < 0) state.cat = "전체";
    toggleRow("filters", cats, state.cat, function (v) { state.cat = v; render(); });
    document.getElementById("filters").hidden = arts.length === 0;

    var list = document.getElementById("list"); list.textContent = "";
    var shown = arts.filter(function (a) { return state.cat === "전체" || a.category === state.cat; });
    if (!shown.length) {
      list.appendChild(el("li", "none", arts.length ? "조건에 맞는 기사 없음" : (c.searchStatus || "확인된 기사 없음")));
      return;
    }
    shown.forEach(function (a) {
      var li = el("li", "item");
      li.appendChild(el("span", "date", a.date || "날짜 미상"));
      li.appendChild(el("span", "outlet", a.outlet || "언론사 미상"));
      var body = el("div", "body");
      body.appendChild(link(a.title || "(제목 없음)", a.url, "title"));
      if (a.summary) body.appendChild(el("p", "summary", a.summary));
      var tags = el("div", "tags");
      tags.appendChild(el("span", "imp " + (a.importance || "low"), "중요도 " + (IMP[a.importance] || "낮음")));
      if (a.category) tags.appendChild(el("span", "cat", a.category));
      if (a.auto) tags.appendChild(el("span", "auto", "자동 수집"));
      if (a.also && a.also.length) {
        var al = el("span", "also", "관련 보도: ");
        a.also.forEach(function (o, i) {
          if (i) al.appendChild(document.createTextNode(", "));
          al.appendChild(link(o.outlet || "기사", o.url));
        });
        tags.appendChild(al);
      }
      body.appendChild(tags);
      li.appendChild(body);
      list.appendChild(li);
    });
  }

  function select(id, remember) {
    state.id = id; state.cat = "전체"; render();
    if (remember) { try { localStorage.setItem("cpn-company", id); } catch (e) {} }
  }

  renderTop();
  var start = (location.hash || "").slice(1);
  if (!chips[start]) { try { start = localStorage.getItem("cpn-company") || ""; } catch (e) { start = ""; } }
  if (!chips[start]) {
    var firstWith = companies.filter(function (c) { return (c.articles || []).length; })[0] || companies[0];
    start = firstWith ? firstWith.id : "";
  }
  if (start) select(start, false);
})();
</script>
</body>
</html>
